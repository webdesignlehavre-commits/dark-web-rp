<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARKNET // Inscription</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <a href="/" class="logo" style="text-decoration:none">DARK<span>NET</span></a>
  </div>

  <div class="container">
    <div class="form-container">
      <h2>&#128272; CREER UN COMPTE</h2>
      <div id="alert"></div>
      
      <div class="form-group">
        <label>PSEUDO</label>
        <input type="text" id="username" placeholder="Choisissez un pseudo (3+ chars)..." autofocus>
      </div>
      
      <div class="form-group">
        <label>MOT DE PASSE</label>
        <input type="password" id="password" placeholder="Mot de passe (4+ chars)...">
      </div>
      
      <div class="form-group">
        <label>CONFIRMER</label>
        <input type="password" id="password2" placeholder="Confirmez votre mot de passe...">
      </div>
      
      <button class="btn" onclick="doRegister()">S'INSCRIRE</button>
      
      <p style="text-align:center;margin-top:20px;font-size:0.85em;color:var(--text-dim)">
        Deja un compte ? <a href="/login.html" style="color:var(--accent)">Se connecter</a>
      </p>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    async function doRegister() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      
      if (!username || !password) {
        showAlert('alert', 'Remplis tous les champs', 'error');
        return;
      }
      if (password !== password2) {
        showAlert('alert', 'Les mots de passe ne correspondent pas', 'error');
        return;
      }
      
      const result = await register(username, password);
      if (result.success) {
        showAlert('alert', 'Compte cree ! Redirection...', 'success');
        setTimeout(() => window.location.href = '/', 1000);
      } else {
        showAlert('alert', result.error, 'error');
      }
    }
  </script>
</body>
</html>
